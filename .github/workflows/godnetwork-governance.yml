name: GodNetwork Governance Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/**]

jobs:
  governance-audit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mobility
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d mobility"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mobility?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/mobility?schema=public
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Schema contract gate (schema ↔ client ↔ DB)
        run: npm run test:contracts

      - name: Seed golden network
        run: npm run seed:golden

      - name: Run GodNetwork governance audit
        run: npm run audit:godnetwork

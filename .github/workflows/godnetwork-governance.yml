name: GodNetwork Governance Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/**]

jobs:
  governance-audit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mobility
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d mobility"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mobility?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/mobility?schema=public
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Guard — public schema must be empty
        run: |
          npx prisma db execute \
            --config scripts/prisma.bootstrap.ts \
            --stdin <<'SQL'
          DO $$ BEGIN
            IF EXISTS (
              SELECT 1
              FROM information_schema.tables
              WHERE table_schema = 'public'
                AND table_type = 'BASE TABLE'
            ) THEN
              RAISE EXCEPTION 'GOVERNANCE_GATE_ABORT: public schema already has tables';
            END IF;
          END $$;
          SQL

      - name: Apply baseline SQL
        run: >
          npx prisma db execute
          --config scripts/prisma.bootstrap.ts
          --file prisma/migrations/20260101000000_init_baseline/migration.sql

      - name: Mark baseline as applied
        run: >
          npx prisma migrate resolve
          --config scripts/prisma.bootstrap.ts
          --applied 20260101000000_init_baseline

      - name: Mark baseline-superseded historical migrations as applied
        run: npx tsx scripts/baseline-resolve-historical.ts

      - name: Apply post-baseline migrations
        run: npx prisma migrate deploy

      - name: Verify migration status
        run: npx prisma migrate status

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Schema contract gate (schema ↔ client ↔ DB)
        run: npm run test:contracts

      - name: Seed golden network
        run: npm run seed:golden

      - name: Run GodNetwork governance audit
        run: npm run audit:godnetwork

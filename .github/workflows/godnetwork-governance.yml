name: GodNetwork Governance Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/**]

jobs:
  governance-audit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mobility
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d mobility"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mobility?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/mobility?schema=public
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize authorized migration catalog
        id: authorized_catalog
        shell: bash
        run: |
          set -euo pipefail
          output_file="$RUNNER_TEMP/authorized-migration-catalog.log"
          npx tsx scripts/materialize-authorized-migration-catalog.ts | tee "$output_file"

          catalog_path="$(sed -n 's/^AUTHORIZED_CATALOG_PATH=//p' "$output_file")"
          catalog_count="$(sed -n 's/^AUTHORIZED_CATALOG_COUNT=//p' "$output_file")"
          unknown_count="$(sed -n 's/^UNKNOWN_MIGRATION_COUNT=//p' "$output_file")"
          source_excluded_count="$(sed -n 's/^EXCLUDED_MIGRATION_COUNT=//p' "$output_file")"
          excluded_count=3

          test -n "$catalog_path"
          test "$catalog_count" = "57"
          test "$unknown_count" = "0"
          test "$excluded_count" = "3"
          test -d "$catalog_path"
          test -f "$catalog_path/20260824000000_add_ride_offer_history_index/migration.sql"

          for excluded in \
            20260518000000_passenger_codes_not_null_future \
            20260706000000_trip_execution_boundary \
            20260720000000_gps_tracking; do
            test ! -e "$catalog_path/$excluded"
          done

          echo "PRISMA_MIGRATIONS_PATH=$catalog_path" >> "$GITHUB_ENV"
          echo "catalog_path=$catalog_path" >> "$GITHUB_OUTPUT"
          echo "catalog_count=$catalog_count" >> "$GITHUB_OUTPUT"
          echo "unknown_count=$unknown_count" >> "$GITHUB_OUTPUT"
          echo "excluded_count=$excluded_count" >> "$GITHUB_OUTPUT"
          echo "source_excluded_count=$source_excluded_count" >> "$GITHUB_OUTPUT"
          echo "AUTHORIZED_CATALOG_COUNT=$catalog_count"
          echo "UNKNOWN_MIGRATION_COUNT=$unknown_count"
          echo "EXCLUDED_MIGRATION_COUNT=$excluded_count"
          echo "SOURCE_EXCLUDED_MIGRATION_COUNT=$source_excluded_count"
          echo "PRISMA_MIGRATIONS_PATH_PRESENT=YES"

      - name: Guard — public schema must be empty
        run: |
          npx prisma db execute \
            --config scripts/prisma.bootstrap.ts \
            --stdin <<'SQL'
          DO $$ BEGIN
            IF EXISTS (
              SELECT 1
              FROM information_schema.tables
              WHERE table_schema = 'public'
                AND table_type = 'BASE TABLE'
            ) THEN
              RAISE EXCEPTION 'GOVERNANCE_GATE_ABORT: public schema already has tables';
            END IF;
          END $$;
          SQL

      - name: Apply baseline SQL
        run: >
          npx prisma db execute
          --config scripts/prisma.bootstrap.ts
          --file "$PRISMA_MIGRATIONS_PATH/20260101000000_init_baseline/migration.sql"

      - name: Mark baseline as applied
        run: >
          npx prisma migrate resolve
          --config scripts/prisma.bootstrap.ts
          --applied 20260101000000_init_baseline

      - name: Resolve authorized historical migrations
        run: npx tsx scripts/baseline-resolve-historical.ts

      - name: Apply post-baseline migrations
        run: npx prisma migrate deploy --config scripts/prisma.bootstrap.ts

      - name: Verify migration status
        run: npx prisma migrate status --config scripts/prisma.bootstrap.ts

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Schema contract gate (schema ↔ client ↔ DB)
        run: npm run test:contracts

      - name: Seed golden network
        run: npm run seed:golden

      - name: Checkout official frontend for governance audit
        uses: actions/checkout@v4
        with:
          repository: mottapedro/mobility-platform-frontend
          ref: 78ef929e67441596b557314c94e4110511282e74
          token: ${{ secrets.FRONTEND_REPO_READ_TOKEN }}
          path: external/mobility-platform-frontend
          persist-credentials: false

      - name: Run GodNetwork governance audit
        env:
          GODNETWORK_FRONTEND_REPO: ${{ github.workspace }}/external/mobility-platform-frontend
        run: npm run audit:godnetwork

      - name: Cleanup authorized migration catalog
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          catalog_path="${PRISMA_MIGRATIONS_PATH:-}"
          if [[ -z "$catalog_path" ]]; then
            echo "No temporary migration catalog to clean"
            exit 0
          fi
          case "$catalog_path" in
            /tmp/mobility-authorized-migrations-*) rm -rf -- "$catalog_path" ;;
            *) echo "Refusing to remove unexpected catalog path: $catalog_path" >&2; exit 1 ;;
          esac

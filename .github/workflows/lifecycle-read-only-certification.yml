name: Lifecycle Read-Only Certification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle-read-only-certification:
    name: Lifecycle read-only certification
    environment: supabase-e2e-migration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.OFFER_BOOK_SUPABASE_E2E_DATABASE_URL }}
      E2E_CA_CERT: ${{ secrets.OFFER_BOOK_SUPABASE_E2E_CA_CERT }}
    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --include=dev --ignore-scripts

      - name: Materialize verified authorized catalog
        shell: bash
        run: |
          set -euo pipefail
          artifact_root="$RUNNER_TEMP/authorized-migration-catalog"
          npx tsx scripts/materialize-authorized-migration-catalog.ts \
            --output-dir "$artifact_root" \
            --verify-fingerprint
          echo "PRISMA_MIGRATIONS_PATH=$artifact_root/catalog" >> "$GITHUB_ENV"

      - name: Run read-only schema and migration certification
        run: node scripts/e2e/lifecycle-read-only-certification.cjs --mode PRE_INCREMENTAL_DEPLOY

name: Offer Book E2E DB Preflight

on:
  workflow_dispatch:
    inputs:
      authorize_migrate:
        description: 'Type I_UNDERSTAND to authorize Supabase E2E migrate deploy'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: offer-book-e2e-db-preflight
  cancel-in-progress: false

jobs:
  pooler-capability-proof:
    name: Supabase E2E pooler capability proof (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --include=dev --ignore-scripts

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run pooler capability proof (read-only)
        env:
          DATABASE_URL: ${{ secrets.OFFER_BOOK_SUPABASE_E2E_DATABASE_URL }}
          E2E_CA_CERT: ${{ secrets.OFFER_BOOK_SUPABASE_E2E_CA_CERT }}
        run: node scripts/e2e/supabase-pooler-capability-proof.cjs

  connection-proof:
    name: Supabase E2E connection proof (read-only)
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm

      - name: Test target rejection
        run: node --test tests/e2e-guards/supabase-target.test.cjs

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --include=dev --ignore-scripts

      - name: Prove both connections and fresh public scope
        env:
          DATABASE_URL: ${{ secrets.OFFER_BOOK_SUPABASE_E2E_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.OFFER_BOOK_SUPABASE_E2E_DIRECT_URL }}
          E2E_CA_CERT: ${{ secrets.OFFER_BOOK_SUPABASE_E2E_CA_CERT }}
        run: node scripts/e2e/supabase-connection-proof.cjs

      - name: Record outcome
        if: always()
        env:
          PROOF_JOB_STATUS: ${{ job.status }}
        run: |
          echo "Connection job status: $PROOF_JOB_STATUS" >> "$GITHUB_STEP_SUMMARY"
          echo "Bootstrap authorized: NO. Bootstrap executed: NO." >> "$GITHUB_STEP_SUMMARY"

  migration-state-audit:
    name: Supabase E2E migration state audit (read-only)
    if: ${{ github.event.inputs.authorize_migrate != 'I_UNDERSTAND' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.OFFER_BOOK_SUPABASE_E2E_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.OFFER_BOOK_SUPABASE_E2E_DIRECT_URL }}
      E2E_CA_CERT: ${{ secrets.OFFER_BOOK_SUPABASE_E2E_CA_CERT }}
      PRISMA_MIGRATIONS_PATH: prisma/migrations

    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Audit current migration state read-only
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const { Client } = require('pg');

          const redact = (value) => String(value ?? '')
            .replace(/postgres(?:ql)?:\/\/\S+/gi, '<REDACTED_DATABASE_URL>')
            .replace(/-----BEGIN [^-]+-----[\s\S]*?-----END [^-]+-----/g, '<REDACTED_CERTIFICATE>')
            .replace(/password\s*=\s*[^;\s]+/gi, 'password=<REDACTED>');

          const required = ['DATABASE_URL', 'DIRECT_URL', 'E2E_CA_CERT', 'PRISMA_MIGRATIONS_PATH'];
          for (const key of required) {
            if (!process.env[key]) {
              console.log(`STATE_AUDIT=FAIL missing=${key}`);
              process.exit(1);
            }
          }

          const baselineFile = path.join(
            process.env.PRISMA_MIGRATIONS_PATH,
            '20260101000000_init_baseline',
            'migration.sql',
          );
          const baselineSql = fs.existsSync(baselineFile)
            ? fs.readFileSync(baselineFile, 'utf8')
            : '';
          const expectedBaselineTables = [...baselineSql.matchAll(/CREATE TABLE\s+(?:"public"\.)?"([^"]+)"/g)]
            .map((match) => match[1])
            .sort();
          const expectedBaselineEnums = [...baselineSql.matchAll(/CREATE TYPE\s+(?:"public"\.)?"([^"]+)"/g)]
            .map((match) => match[1])
            .sort();

          const client = new Client({
            connectionString: process.env.DATABASE_URL,
            ssl: {
              ca: process.env.E2E_CA_CERT,
              rejectUnauthorized: true,
            },
          });

          const classifyStateAuditFailure = (error) => {
            const code = typeof error?.code === 'string' ? error.code : '';
            const message = error instanceof Error ? error.message : String(error ?? '');
            if (code === '28P01' || code === '28000') return 'AUTHENTICATION_FAILURE';
            if (code === 'ENOTFOUND' || code === 'EAI_AGAIN' || code === 'ECONNREFUSED' || code === 'ETIMEDOUT' || code === 'ECONNRESET') {
              return 'NETWORK_FAILURE';
            }
            if (code.startsWith('CERT_') || code === 'DEPTH_ZERO_SELF_SIGNED_CERT' || code === 'SELF_SIGNED_CERT_IN_CHAIN'
              || code === 'UNABLE_TO_VERIFY_LEAF_SIGNATURE' || code === 'ERR_TLS_CERT_ALTNAME_INVALID') {
              return 'TLS_FAILURE';
            }
            if (/does not exist|permission denied|relation .* does not exist|schema|database/i.test(message)) {
              return 'DATABASE_STATE_FAILURE';
            }
            return 'CONNECTION_FAILURE';
          };

          const names = (rows, key) => rows.map((row) => row[key]).sort();

          (async () => {
            try {
              await client.connect();
              await client.query('BEGIN READ ONLY');

              const controlTable = await client.query(`
                SELECT EXISTS (
                  SELECT 1
                  FROM information_schema.tables
                  WHERE table_schema = 'public'
                    AND table_name = '_prisma_migrations'
                    AND table_type = 'BASE TABLE'
                ) AS exists
              `);
              const hasMigrationsTable = controlTable.rows[0].exists === true;

              const tables = await client.query(`
                SELECT table_name
                FROM information_schema.tables
                WHERE table_schema = 'public'
                  AND table_type = 'BASE TABLE'
                ORDER BY table_name
              `);
              const enums = await client.query(`
                SELECT t.typname AS enum_name
                FROM pg_type t
                JOIN pg_namespace n ON n.oid = t.typnamespace
                WHERE n.nspname = 'public'
                  AND t.typtype = 'e'
                ORDER BY t.typname
              `);
              const indexes = await client.query(`
                SELECT c.relname AS index_name
                FROM pg_class c
                JOIN pg_namespace n ON n.oid = c.relnamespace
                WHERE n.nspname = 'public'
                  AND c.relkind = 'i'
                ORDER BY c.relname
              `);
              const constraints = await client.query(`
                SELECT conname AS constraint_name, contype AS constraint_type
                FROM pg_constraint c
                JOIN pg_namespace n ON n.oid = c.connamespace
                WHERE n.nspname = 'public'
                ORDER BY conname
              `);

              console.log(`STATE_AUDIT_PRISMA_MIGRATIONS_TABLE=${hasMigrationsTable ? 'YES' : 'NO'}`);
              console.log(`STATE_AUDIT_PUBLIC_TABLE_COUNT=${tables.rows.length}`);
              console.log(`STATE_AUDIT_PUBLIC_ENUM_COUNT=${enums.rows.length}`);
              console.log(`STATE_AUDIT_PUBLIC_INDEX_COUNT=${indexes.rows.length}`);
              console.log(`STATE_AUDIT_PUBLIC_CONSTRAINT_COUNT=${constraints.rows.length}`);
              console.log(`STATE_AUDIT_PUBLIC_TABLES=${names(tables.rows, 'table_name').join(',') || 'NONE'}`);
              console.log(`STATE_AUDIT_PUBLIC_ENUMS=${names(enums.rows, 'enum_name').join(',') || 'NONE'}`);
              console.log(`STATE_AUDIT_PUBLIC_INDEXES=${names(indexes.rows, 'index_name').join(',') || 'NONE'}`);
              console.log(`STATE_AUDIT_PUBLIC_CONSTRAINTS=${constraints.rows.map((row) => `${row.constraint_name}:${row.constraint_type}`).join(',') || 'NONE'}`);

              const actualTables = new Set(names(tables.rows, 'table_name'));
              const actualEnums = new Set(names(enums.rows, 'enum_name'));
              const baselineTablesPresent = expectedBaselineTables.filter((name) => actualTables.has(name));
              const baselineEnumsPresent = expectedBaselineEnums.filter((name) => actualEnums.has(name));
              console.log(`STATE_AUDIT_BASELINE_TABLES_EXPECTED=${expectedBaselineTables.length}`);
              console.log(`STATE_AUDIT_BASELINE_TABLES_PRESENT=${baselineTablesPresent.length}`);
              console.log(`STATE_AUDIT_BASELINE_TABLES_PARTIAL=${baselineTablesPresent.join(',') || 'NONE'}`);
              console.log(`STATE_AUDIT_BASELINE_ENUMS_EXPECTED=${expectedBaselineEnums.length}`);
              console.log(`STATE_AUDIT_BASELINE_ENUMS_PRESENT=${baselineEnumsPresent.length}`);
              console.log(`STATE_AUDIT_BASELINE_ENUMS_PARTIAL=${baselineEnumsPresent.join(',') || 'NONE'}`);

              if (hasMigrationsTable) {
                const migrations = await client.query(`
                  SELECT migration_name, started_at, finished_at, rolled_back_at, logs
                  FROM public."_prisma_migrations"
                  ORDER BY started_at NULLS LAST, migration_name
                `);
                const unfinished = migrations.rows.filter((row) => !row.finished_at && !row.rolled_back_at);
                const withLogs = migrations.rows.filter((row) => row.logs);

                console.log(`STATE_AUDIT_MIGRATION_ROW_COUNT=${migrations.rows.length}`);
                console.log(`STATE_AUDIT_MIGRATIONS_UNFINISHED=${unfinished.length}`);
                console.log(`STATE_AUDIT_MIGRATIONS_WITH_LOGS=${withLogs.length}`);
                console.log(`STATE_AUDIT_UNFINISHED_NAMES=${unfinished.map((row) => row.migration_name).join(',') || 'NONE'}`);

                for (const row of withLogs) {
                  const sanitizedLog = redact(row.logs);
                  const digest = crypto.createHash('sha256').update(sanitizedLog).digest('hex');
                  console.log(`STATE_AUDIT_FAILED_MIGRATION=${row.migration_name}`);
                  console.log(`STATE_AUDIT_FAILED_LOG_SHA256=${digest}`);
                  console.log(`STATE_AUDIT_FAILED_LOG_BYTES=${Buffer.byteLength(sanitizedLog, 'utf8')}`);
                  console.log('STATE_AUDIT_FAILED_LOG_BEGIN');
                  console.log(sanitizedLog.split(/\r?\n/).slice(0, 20).join('\n') || 'EMPTY');
                  console.log('STATE_AUDIT_FAILED_LOG_END');
                }
              }

              await client.query('COMMIT');
              console.log('STATE_AUDIT=PASS');
            } catch (error) {
              console.log(`STATE_AUDIT_FAILURE_CLASSIFICATION=${classifyStateAuditFailure(error)}`);
              console.log('STATE_AUDIT=FAIL');
              try {
                await client.query('ROLLBACK');
              } catch {}
              process.exitCode = 1;
            } finally {
              await client.end().catch(() => {});
            }
          })();
          NODE

  preflight:
    # Bootstrap remains disabled until a separate execution gate authorizes writes.
    if: ${{ false }}
    name: E2E PostgreSQL preflight and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.OFFER_BOOK_SUPABASE_E2E_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.OFFER_BOOK_SUPABASE_E2E_DIRECT_URL }}
      E2E_RUN_ID: offer-book-e2e-db-preflight-${{ github.run_id }}
      E2E_SERVICE_NAME: mobility-platform-offer-book-e2e
      EXPECTED_DATABASE_NAME: postgres
      EXPECTED_SUPABASE_PROJECT_REF: azgzwflujgerrddrkmjh

    steps:
      - name: Checkout selected branch or commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Guard checkout ancestry
        id: checkout_guard
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          echo "HEAD_SHA=${head_sha}" >> "$GITHUB_OUTPUT"
          echo "HEAD_SHA=${head_sha}"
          git merge-base --is-ancestor \
            1e35b1a95677a04ee8dd0eaeff212e4138d16140 \
            "$head_sha"

      - name: Guard E2E secrets, database identity, and env-file isolation
        id: target_guard
        shell: bash
        run: |
          set -euo pipefail

          for key in DATABASE_URL DIRECT_URL E2E_RUN_ID; do
            if [[ -z "${!key:-}" ]]; then
              echo "${key}_PRESENT=NO"
              echo "Required E2E value is missing: ${key}" >&2
              exit 1
            fi
            echo "${key}_PRESENT=YES"
          done

          for forbidden_file in .env .env.local .env.production; do
            if [[ -e "$forbidden_file" ]]; then
              echo "Forbidden environment file present: ${forbidden_file}" >&2
              exit 1
            fi
          done

          node scripts/e2e/supabase-connection-proof.cjs --guard-only

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Materialize authorized migration catalog
        id: authorized_catalog
        shell: bash
        run: |
          set -euo pipefail
          output_file="$RUNNER_TEMP/authorized-migration-catalog.log"
          npx tsx scripts/materialize-authorized-migration-catalog.ts | tee "$output_file"

          catalog_path="$(sed -n 's/^AUTHORIZED_CATALOG_PATH=//p' "$output_file")"
          catalog_count="$(sed -n 's/^AUTHORIZED_CATALOG_COUNT=//p' "$output_file")"
          unknown_count="$(sed -n 's/^UNKNOWN_MIGRATION_COUNT=//p' "$output_file")"
          source_excluded_count="$(sed -n 's/^EXCLUDED_MIGRATION_COUNT=//p' "$output_file")"
          excluded_count=3

          test -n "$catalog_path"
          test "$catalog_count" = "51"
          test "$unknown_count" = "0"
          test "$excluded_count" = "3"
          test -d "$catalog_path"
          test -f "$catalog_path/20260824000000_add_ride_offer_history_index/migration.sql"

          for excluded in \
            20260518000000_passenger_codes_not_null_future \
            20260706000000_trip_execution_boundary \
            20260720000000_gps_tracking; do
            test ! -e "$catalog_path/$excluded"
          done

          echo "PRISMA_MIGRATIONS_PATH=$catalog_path" >> "$GITHUB_ENV"
          echo "catalog_path=$catalog_path" >> "$GITHUB_OUTPUT"
          echo "catalog_count=$catalog_count" >> "$GITHUB_OUTPUT"
          echo "unknown_count=$unknown_count" >> "$GITHUB_OUTPUT"
          echo "excluded_count=$excluded_count" >> "$GITHUB_OUTPUT"
          echo "source_excluded_count=$source_excluded_count" >> "$GITHUB_OUTPUT"
          echo "AUTHORIZED_CATALOG_COUNT=$catalog_count"
          echo "UNKNOWN_MIGRATION_COUNT=$unknown_count"
          echo "EXCLUDED_MIGRATION_COUNT=$excluded_count"
          echo "SOURCE_EXCLUDED_MIGRATION_COUNT=$source_excluded_count"
          echo "PRISMA_MIGRATIONS_PATH_PRESENT=YES"

      - name: Verify Offer Book migration artifact
        id: offer_book_migration
        shell: bash
        run: |
          set -euo pipefail
          migration="$PRISMA_MIGRATIONS_PATH/20260824000000_add_ride_offer_history_index/migration.sql"
          test -f "$migration"
          grep -Fq 'CREATE INDEX "RideOffer_driverId_createdAt_idx"' "$migration"
          echo "OFFER_BOOK_MIGRATION_PRESENT=YES"

      - name: Verify database identity (read-only)
        id: database_identity
        shell: bash
        run: |
          node <<'NODE'
          const { PrismaClient } = require('@prisma/client');
          const { PrismaPg } = require('@prisma/adapter-pg');
          const { Pool } = require('pg');

          const pool = new Pool({
            connectionString: process.env.DATABASE_URL,
            ssl: {
              rejectUnauthorized: false,
            },
          });
          const adapter = new PrismaPg(pool);
          const prisma = new PrismaClient({ adapter });

          (async () => {
            try {
              const rows = await prisma.$queryRaw`SELECT current_database() AS "databaseName"`;
              const databaseName = rows[0]?.databaseName;
              console.log(`CURRENT_DATABASE=${databaseName}`);
              if (databaseName !== process.env.EXPECTED_DATABASE_NAME) {
                console.error('DATABASE_IDENTITY_MATCH=NO');
                process.exitCode = 1;
                return;
              }
              console.log('DATABASE_IDENTITY_MATCH=YES');
            } catch (error) {
              const errorName = error instanceof Error ? error.name : 'UnknownError';
              const errorMessage = error instanceof Error ? error.message : String(error);
              console.error(`DATABASE_CONNECTIVITY_ERROR_NAME=${errorName}`);
              console.error(`DATABASE_CONNECTIVITY_ERROR_MESSAGE=${errorMessage}`);
              console.error('DATABASE_CONNECTIVITY=FAIL');
              process.exitCode = 1;
            } finally {
              await prisma.$disconnect();
              await pool.end();
            }
          })();
          NODE

      - name: Guard E2E public schema is empty
        shell: bash
        run: |
          npx prisma db execute \
            --config scripts/prisma.bootstrap.ts \
            --stdin <<'SQL'
          DO $$ BEGIN
            IF EXISTS (
              SELECT 1
              FROM information_schema.tables
              WHERE table_schema = 'public'
                AND table_type = 'BASE TABLE'
            ) THEN
              RAISE EXCEPTION 'E2E_PREFLIGHT_ABORT: public schema is not empty';
            END IF;
          END $$;
          SQL

      - name: Apply certified baseline SQL
        shell: bash
        run: >
          npx prisma db execute
          --config scripts/prisma.bootstrap.ts
          --file "$PRISMA_MIGRATIONS_PATH/20260101000000_init_baseline/migration.sql"

      - name: Mark certified baseline as applied
        shell: bash
        run: >
          npx prisma migrate resolve
          --config scripts/prisma.bootstrap.ts
          --applied 20260101000000_init_baseline

      - name: Resolve authorized historical migrations
        shell: bash
        run: npx tsx scripts/baseline-resolve-historical.ts

      - name: Prisma migration status before deploy
        id: migrate_status_before
        shell: bash
        run: |
          set +e
          npx prisma migrate status \
            --config scripts/prisma.bootstrap.ts \
            > "$RUNNER_TEMP/prisma-status-before.log" 2>&1
          exit_code=$?
          set -e

          sed -E 's#postgres(ql)?://[^[:space:]]+#<REDACTED_DATABASE_URL>#g' \
            "$RUNNER_TEMP/prisma-status-before.log"

          if [[ $exit_code -ne 0 ]]; then
            if grep -Eqi \
              'failed migration|migration failed|P3009|P3018|P3015|P3006|drift|diverg|checksum|modified migration' \
              "$RUNNER_TEMP/prisma-status-before.log"; then
              echo "MIGRATION_CHAIN_BLOCKED=YES" >&2
              exit "$exit_code"
            fi

            if grep -Eqi \
              'pending migrations|not yet been applied|not yet applied|to apply migrations in production run prisma migrate deploy|database schema is not up to date' \
              "$RUNNER_TEMP/prisma-status-before.log"; then
              echo "status=PENDING" >> "$GITHUB_OUTPUT"
              echo "PRISMA_STATUS_BEFORE=PENDING"
              exit 0
            fi

            echo "MIGRATION_CHAIN_BLOCKED=YES" >&2
            exit "$exit_code"
          fi

          echo "status=PASS" >> "$GITHUB_OUTPUT"
          echo "PRISMA_STATUS_BEFORE=PASS"

      - name: Apply E2E migrations
        id: migrate_deploy
        shell: bash
        run: |
          set +e
          npx prisma migrate deploy \
            --config scripts/prisma.bootstrap.ts \
            > "$RUNNER_TEMP/prisma-migrate-deploy.log" 2>&1
          exit_code=$?
          set -e

          sed -E 's#postgres(ql)?://[^[:space:]]+#<REDACTED_DATABASE_URL>#g' \
            "$RUNNER_TEMP/prisma-migrate-deploy.log"
          if [[ $exit_code -ne 0 ]]; then
            echo "MIGRATION_CHAIN_BLOCKED=YES" >&2
          else
            echo "status=PASS" >> "$GITHUB_OUTPUT"
          fi
          exit "$exit_code"

      - name: Prisma migration status after deploy
        id: migrate_status_after
        shell: bash
        run: |
          set +e
          npx prisma migrate status \
            --config scripts/prisma.bootstrap.ts \
            > "$RUNNER_TEMP/prisma-status-after.log" 2>&1
          exit_code=$?
          set -e

          sed -E 's#postgres(ql)?://[^[:space:]]+#<REDACTED_DATABASE_URL>#g' \
            "$RUNNER_TEMP/prisma-status-after.log"
          if [[ $exit_code -eq 0 ]]; then
            echo "status=PASS" >> "$GITHUB_OUTPUT"
          fi
          exit "$exit_code"

      - name: Verify Offer Book migration and index (read-only)
        id: offer_book_index
        shell: bash
        run: |
          node <<'NODE'
          const { PrismaClient } = require('@prisma/client');
          const prisma = new PrismaClient();
          const migrationName = '20260824000000_add_ride_offer_history_index';
          const indexName = 'RideOffer_driverId_createdAt_idx';

          (async () => {
            try {
              const migration = await prisma.$queryRaw`
                SELECT 1
                FROM "_prisma_migrations"
                WHERE migration_name = ${migrationName}
                  AND finished_at IS NOT NULL
                LIMIT 1
              `;
              const index = await prisma.$queryRaw`
                SELECT 1
                FROM pg_class c
                JOIN pg_namespace n ON n.oid = c.relnamespace
                WHERE n.nspname = 'public'
                  AND c.relname = ${indexName}
                  AND c.relkind = 'i'
                LIMIT 1
              `;

              if (migration.length !== 1 || index.length !== 1) {
                console.error('OFFER_BOOK_MIGRATION_OR_INDEX=NOT_PRESENT');
                process.exitCode = 1;
                return;
              }

              console.log('OFFER_BOOK_MIGRATION_APPLIED=YES');
              console.log('OFFER_BOOK_INDEX_PRESENT=YES');
            } catch {
              console.error('OFFER_BOOK_INDEX_CHECK=FAIL');
              process.exitCode = 1;
            } finally {
              await prisma.$disconnect();
            }
          })();
          NODE

      - name: Write preflight summary
        if: always()
        shell: bash
        env:
          HEAD_SHA: ${{ steps.checkout_guard.outputs.HEAD_SHA }}
          DATABASE_IDENTITY_MATCH: ${{ steps.database_identity.outcome == 'success' && 'YES' || 'NO' }}
          STATUS_BEFORE_STATUS: ${{ steps.migrate_status_before.outputs.status }}
          STATUS_BEFORE_OUTCOME: ${{ steps.migrate_status_before.outcome }}
          MIGRATE_DEPLOY_STATUS: ${{ steps.migrate_deploy.outputs.status }}
          MIGRATE_DEPLOY_OUTCOME: ${{ steps.migrate_deploy.outcome }}
          STATUS_AFTER_STATUS: ${{ steps.migrate_status_after.outputs.status }}
          STATUS_AFTER_OUTCOME: ${{ steps.migrate_status_after.outcome }}
          OFFER_BOOK_MIGRATION_OUTCOME: ${{ steps.offer_book_migration.outcome }}
          OFFER_BOOK_INDEX_OUTCOME: ${{ steps.offer_book_index.outcome }}
        run: |
          {
            echo '## Offer Book E2E database preflight'
            echo '- SERVICE: mobility-platform-offer-book-e2e'
            echo "- HEAD_SHA: ${HEAD_SHA:-NOT_AVAILABLE}"
            echo "- DATABASE_IDENTITY_MATCH: ${DATABASE_IDENTITY_MATCH:-NO}"
            echo "- PRISMA_STATUS_BEFORE: ${STATUS_BEFORE_STATUS:-${STATUS_BEFORE_OUTCOME:-not_run}}"
            echo "- MIGRATION_CHAIN_BLOCKED: $([[ "${STATUS_BEFORE_OUTCOME:-}" == failure || "${MIGRATE_DEPLOY_OUTCOME:-}" == failure ]] && echo YES || echo NO/NOT_PROVEN)"
            echo "- MIGRATIONS_APPLIED: ${MIGRATE_DEPLOY_STATUS:-${MIGRATE_DEPLOY_OUTCOME:-not_run}}"
            echo "- PRISMA_STATUS_AFTER: ${STATUS_AFTER_STATUS:-${STATUS_AFTER_OUTCOME:-not_run}}"
            echo "- OFFER_BOOK_MIGRATION_PRESENT: ${OFFER_BOOK_MIGRATION_OUTCOME:-not_run}"
            echo "- OFFER_BOOK_INDEX_PRESENT: ${OFFER_BOOK_INDEX_OUTCOME:-not_run}"
            echo '- FIXTURES_CREATED: 0'
            echo '- BUSINESS_WRITES_EXECUTED: migrations only, if all guards passed'
            echo '- PRODUCTION_SERVICE_ACCESSED: NO'
            echo '- PRODUCTION_DATABASE_ACCESSED: NO'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup authorized migration catalog
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          catalog_path="${PRISMA_MIGRATIONS_PATH:-}"
          if [[ -z "$catalog_path" ]]; then
            echo "No temporary migration catalog to clean"
            exit 0
          fi
          case "$catalog_path" in
            /tmp/mobility-authorized-migrations-*) rm -rf -- "$catalog_path" ;;
            *) echo "Refusing to remove unexpected catalog path: $catalog_path" >&2; exit 1 ;;
          esac

  migrate-deploy:
    name: Supabase E2E migrate deploy (manual)
    needs: connection-proof
    if: ${{ github.event.inputs.authorize_migrate == 'I_UNDERSTAND' && needs.connection-proof.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.OFFER_BOOK_SUPABASE_E2E_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.OFFER_BOOK_SUPABASE_E2E_DIRECT_URL }}
      E2E_CA_CERT: ${{ secrets.OFFER_BOOK_SUPABASE_E2E_CA_CERT }}

    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Materialize authorized migration catalog
        id: authorized_catalog
        shell: bash
        run: |
          set -euo pipefail
          output_file="$RUNNER_TEMP/authorized-migration-catalog.log"
          npx tsx scripts/materialize-authorized-migration-catalog.ts > "$output_file"

          catalog_path="$(sed -n 's/^AUTHORIZED_CATALOG_PATH=//p' "$output_file")"
          catalog_count="$(sed -n 's/^AUTHORIZED_CATALOG_COUNT=//p' "$output_file")"
          unknown_count="$(sed -n 's/^UNKNOWN_MIGRATION_COUNT=//p' "$output_file")"
          source_excluded_count="$(sed -n 's/^EXCLUDED_MIGRATION_COUNT=//p' "$output_file")"
          excluded_count=3

          test -n "$catalog_path"
          test "$catalog_count" = "51"
          test "$unknown_count" = "0"
          test "$excluded_count" = "3"
          test -d "$catalog_path"
          test -f "$catalog_path/20260101000000_init_baseline/migration.sql"
          test -f "$catalog_path/20260824000000_add_ride_offer_history_index/migration.sql"

          for excluded in \
            20260518000000_passenger_codes_not_null_future \
            20260706000000_trip_execution_boundary \
            20260720000000_gps_tracking; do
            test ! -e "$catalog_path/$excluded"
          done

          echo "PRISMA_MIGRATIONS_PATH=$catalog_path" >> "$GITHUB_ENV"
          echo "catalog_path=$catalog_path" >> "$GITHUB_OUTPUT"
          echo "catalog_count=$catalog_count" >> "$GITHUB_OUTPUT"
          echo "unknown_count=$unknown_count" >> "$GITHUB_OUTPUT"
          echo "excluded_count=$excluded_count" >> "$GITHUB_OUTPUT"
          echo "source_excluded_count=$source_excluded_count" >> "$GITHUB_OUTPUT"
          echo "AUTHORIZED_CATALOG_COUNT=$catalog_count"
          echo "UNKNOWN_MIGRATION_COUNT=$unknown_count"
          echo "EXCLUDED_MIGRATION_COUNT=$excluded_count"
          echo "SOURCE_EXCLUDED_MIGRATION_COUNT=$source_excluded_count"
          echo "PRISMA_MIGRATIONS_PATH_PRESENT=YES"

      - name: Apply certified baseline SQL
        id: baseline_sql
        shell: bash
        run: |
          set +e
          echo "executed=true" >> "$GITHUB_OUTPUT"
          npx prisma db execute \
            --config scripts/prisma.bootstrap.ts \
            --file "$PRISMA_MIGRATIONS_PATH/20260101000000_init_baseline/migration.sql" \
            > "$RUNNER_TEMP/prisma-baseline-sql.log" 2>&1
          exit_code=$?
          set -e

          if [[ $exit_code -eq 0 ]]; then
            echo "status=PASS" >> "$GITHUB_OUTPUT"
            echo "BASELINE_SQL=PASS"
            exit 0
          fi

          echo "status=FAIL" >> "$GITHUB_OUTPUT"
          echo "classification=DATABASE_STATE_FAILURE" >> "$GITHUB_OUTPUT"
          echo "migration=20260101000000_init_baseline" >> "$GITHUB_OUTPUT"
          echo "BASELINE_SQL=FAIL"
          echo "BASELINE_SQL_FAILURE_CLASSIFICATION=DATABASE_STATE_FAILURE"
          echo "BASELINE_SQL_AFFECTED_MIGRATION=20260101000000_init_baseline"
          exit "$exit_code"

      - name: Mark certified baseline as applied
        id: baseline_resolve
        shell: bash
        run: |
          set +e
          npx prisma migrate resolve \
            --config scripts/prisma.bootstrap.ts \
            --applied 20260101000000_init_baseline \
            > "$RUNNER_TEMP/prisma-baseline-resolve.log" 2>&1
          exit_code=$?
          set -e

          if [[ $exit_code -eq 0 ]]; then
            echo "status=PASS" >> "$GITHUB_OUTPUT"
            echo "BASELINE_RESOLVE=PASS"
            exit 0
          fi

          echo "status=FAIL" >> "$GITHUB_OUTPUT"
          echo "classification=DATABASE_STATE_FAILURE" >> "$GITHUB_OUTPUT"
          echo "migration=20260101000000_init_baseline" >> "$GITHUB_OUTPUT"
          echo "BASELINE_RESOLVE=FAIL"
          echo "BASELINE_RESOLVE_FAILURE_CLASSIFICATION=DATABASE_STATE_FAILURE"
          echo "BASELINE_RESOLVE_AFFECTED_MIGRATION=20260101000000_init_baseline"
          exit "$exit_code"

      - name: Resolve authorized historical migrations
        id: historical_resolve
        shell: bash
        run: |
          set +e
          npx tsx scripts/baseline-resolve-historical.ts \
            > "$RUNNER_TEMP/prisma-historical-resolve.log" 2>&1
          exit_code=$?
          set -e

          if [[ $exit_code -eq 0 ]]; then
            echo "status=PASS" >> "$GITHUB_OUTPUT"
            echo "HISTORICAL_RESOLVE=PASS"
            exit 0
          fi

          migration="$(
            grep -Eo '[0-9]{14}_[A-Za-z0-9_-]+' "$RUNNER_TEMP/prisma-historical-resolve.log" \
              | head -n 1 \
              || true
          )"
          if [[ -z "$migration" ]]; then
            migration="UNKNOWN"
          fi

          echo "status=FAIL" >> "$GITHUB_OUTPUT"
          echo "classification=DATABASE_STATE_FAILURE" >> "$GITHUB_OUTPUT"
          echo "migration=$migration" >> "$GITHUB_OUTPUT"
          echo "HISTORICAL_RESOLVE=FAIL"
          echo "HISTORICAL_RESOLVE_FAILURE_CLASSIFICATION=DATABASE_STATE_FAILURE"
          echo "HISTORICAL_RESOLVE_AFFECTED_MIGRATION=$migration"
          exit "$exit_code"

      - name: Apply post-cutoff migrations
        id: migrate_deploy
        shell: bash
        run: |
          set +e
          echo "executed=true" >> "$GITHUB_OUTPUT"
          npx prisma migrate deploy \
            --config scripts/prisma.bootstrap.ts \
            > "$RUNNER_TEMP/prisma-migrate-deploy.log" 2>&1
          exit_code=$?
          set -e

          if [[ $exit_code -eq 0 ]]; then
            echo "status=PASS" >> "$GITHUB_OUTPUT"
            echo "MIGRATE_DEPLOY=PASS"
            exit 0
          fi

          classification="CONNECTION_FAILURE"
          if grep -Eqi 'P3009|P3018|failed migration|migration failed|already failed|database schema is not empty|drift|diverg|checksum|modified migration' "$RUNNER_TEMP/prisma-migrate-deploy.log"; then
            classification="DATABASE_STATE_FAILURE"
          elif grep -Eqi 'authentication failed|password authentication failed|permission denied|role .* does not exist|P1000' "$RUNNER_TEMP/prisma-migrate-deploy.log"; then
            classification="AUTHENTICATION_FAILURE"
          elif grep -Eqi 'certificate|self-signed|unable to verify|tls|ssl|CERT_|DEPTH_ZERO_SELF_SIGNED_CERT' "$RUNNER_TEMP/prisma-migrate-deploy.log"; then
            classification="TLS_FAILURE"
          elif grep -Eqi 'timeout|timed out|ECONNREFUSED|ENOTFOUND|EHOSTUNREACH|ETIMEDOUT|P1001' "$RUNNER_TEMP/prisma-migrate-deploy.log"; then
            classification="NETWORK_FAILURE"
          fi

          migration="$(
            grep -Eo '[0-9]{14}_[A-Za-z0-9_-]+' "$RUNNER_TEMP/prisma-migrate-deploy.log" \
              | head -n 1 \
              || true
          )"
          if [[ -z "$migration" ]]; then
            migration="UNKNOWN"
          fi

          echo "status=FAIL" >> "$GITHUB_OUTPUT"
          echo "classification=$classification" >> "$GITHUB_OUTPUT"
          echo "migration=$migration" >> "$GITHUB_OUTPUT"
          echo "MIGRATE_DEPLOY=FAIL"
          echo "MIGRATE_DEPLOY_FAILURE_CLASSIFICATION=$classification"
          echo "MIGRATE_DEPLOY_AFFECTED_MIGRATION=$migration"
          exit "$exit_code"

      - name: Audit migration state read-only
        if: success()
        id: migration_audit
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { Client } = require('pg');

          const required = ['DATABASE_URL', 'DIRECT_URL', 'E2E_CA_CERT', 'PRISMA_MIGRATIONS_PATH'];
          for (const key of required) {
            if (!process.env[key]) {
              console.error(`READ_ONLY_AUDIT=FAIL missing=${key}`);
              process.exit(1);
            }
          }

          const migrationsPath = process.env.PRISMA_MIGRATIONS_PATH;
          const expectedMigrations = fs.readdirSync(migrationsPath, { withFileTypes: true })
            .filter((entry) => entry.isDirectory())
            .map((entry) => entry.name)
            .filter((name) => fs.existsSync(path.join(migrationsPath, name, 'migration.sql')))
            .sort();

          const client = new Client({
            connectionString: process.env.DATABASE_URL,
            ssl: {
              ca: process.env.E2E_CA_CERT,
              rejectUnauthorized: true,
            },
          });

          const fail = (message) => {
            console.error(message);
            process.exitCode = 1;
          };

          (async () => {
            try {
              await client.connect();
              await client.query('BEGIN READ ONLY');

              const migrations = await client.query(`
                SELECT migration_name, finished_at, rolled_back_at, logs
                FROM public."_prisma_migrations"
                ORDER BY migration_name
              `);
              const tables = await client.query(`
                SELECT COUNT(*)::int AS count
                FROM information_schema.tables
                WHERE table_schema = 'public'
                  AND table_type = 'BASE TABLE'
              `);
              const enums = await client.query(`
                SELECT COUNT(*)::int AS count
                FROM pg_type t
                JOIN pg_namespace n ON n.oid = t.typnamespace
                WHERE n.nspname = 'public'
                  AND t.typtype = 'e'
              `);
              const indexes = await client.query(`
                SELECT COUNT(*)::int AS count
                FROM pg_class c
                JOIN pg_namespace n ON n.oid = c.relnamespace
                WHERE n.nspname = 'public'
                  AND c.relkind = 'i'
              `);
              const foreignKeys = await client.query(`
                SELECT COUNT(*)::int AS count
                FROM pg_constraint c
                JOIN pg_namespace n ON n.oid = c.connamespace
                WHERE n.nspname = 'public'
                  AND c.contype = 'f'
              `);

              const applied = migrations.rows.map((row) => row.migration_name);
              const failed = migrations.rows.filter((row) => !row.finished_at || row.rolled_back_at || row.logs);
              const missing = expectedMigrations.filter((name) => !applied.includes(name));
              const unexpected = applied.filter((name) => !expectedMigrations.includes(name));

              console.log(`READ_ONLY_AUDIT_MIGRATIONS_EXPECTED=${expectedMigrations.length}`);
              console.log(`READ_ONLY_AUDIT_MIGRATIONS_APPLIED=${applied.length}`);
              console.log(`READ_ONLY_AUDIT_MIGRATIONS_FAILED=${failed.length}`);
              console.log(`READ_ONLY_AUDIT_MIGRATIONS_MISSING=${missing.length}`);
              console.log(`READ_ONLY_AUDIT_MIGRATIONS_UNEXPECTED=${unexpected.length}`);
              console.log(`READ_ONLY_AUDIT_PUBLIC_TABLES=${tables.rows[0].count}`);
              console.log(`READ_ONLY_AUDIT_PUBLIC_ENUMS=${enums.rows[0].count}`);
              console.log(`READ_ONLY_AUDIT_PUBLIC_INDEXES=${indexes.rows[0].count}`);
              console.log(`READ_ONLY_AUDIT_PUBLIC_FOREIGN_KEYS=${foreignKeys.rows[0].count}`);

              if (failed.length > 0 || missing.length > 0 || unexpected.length > 0) {
                fail('READ_ONLY_AUDIT=FAIL');
              } else {
                console.log('READ_ONLY_AUDIT=PASS');
              }

              await client.query('COMMIT');
            } catch {
              fail('READ_ONLY_AUDIT=FAIL');
              try {
                await client.query('ROLLBACK');
              } catch {}
            } finally {
              await client.end().catch(() => {});
            }
          })();
          NODE

      - name: Record migration summary
        if: always()
        env:
          BASELINE_SQL_STATUS: ${{ steps.baseline_sql.outputs.status || 'not_run' }}
          BASELINE_RESOLVE_STATUS: ${{ steps.baseline_resolve.outputs.status || 'not_run' }}
          HISTORICAL_RESOLVE_STATUS: ${{ steps.historical_resolve.outputs.status || 'not_run' }}
          MIGRATE_DEPLOY_EXECUTED: ${{ steps.migrate_deploy.outputs.executed || 'false' }}
          MIGRATE_DEPLOY_STATUS: ${{ steps.migrate_deploy.outputs.status || 'not_run' }}
          MIGRATE_DEPLOY_FAILURE_CLASSIFICATION: ${{ steps.migrate_deploy.outputs.classification || 'not_applicable' }}
          MIGRATE_DEPLOY_AFFECTED_MIGRATION: ${{ steps.migrate_deploy.outputs.migration || 'not_applicable' }}
          MIGRATION_AUDIT_OUTCOME: ${{ steps.migration_audit.outcome || 'not_run' }}
        run: |
          {
            echo '## Supabase E2E migrate deploy'
            echo '- bootstrapExecuted=false'
            echo '- seedExecuted=false'
            echo "- baselineSql=${BASELINE_SQL_STATUS}"
            echo "- historicalResolve=${HISTORICAL_RESOLVE_STATUS}"
            echo "- baselineResolve=${BASELINE_RESOLVE_STATUS}"
            echo "- migrateDeployExecuted=${MIGRATE_DEPLOY_EXECUTED}"
            echo "- migrateDeployStatus=${MIGRATE_DEPLOY_STATUS}"
            echo "- failureClassification=${MIGRATE_DEPLOY_FAILURE_CLASSIFICATION}"
            echo "- affectedMigration=${MIGRATE_DEPLOY_AFFECTED_MIGRATION}"
            echo "- readOnlyAudit=${MIGRATION_AUDIT_OUTCOME}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup authorized migration catalog
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          catalog_path="${PRISMA_MIGRATIONS_PATH:-}"
          if [[ -z "$catalog_path" ]]; then
            echo "No temporary migration catalog to clean"
            exit 0
          fi
          case "$catalog_path" in
            /tmp/mobility-authorized-migrations-*) rm -rf -- "$catalog_path" ;;
            *) echo "Refusing to remove unexpected catalog path: $catalog_path" >&2; exit 1 ;;
          esac

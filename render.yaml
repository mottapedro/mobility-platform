services:
  - type: web
    name: mobility-platform-offer-book-e2e
    runtime: node
    plan: free
    region: virginia
    repo: https://github.com/mottapedro/mobility-platform
    branch: feat/aliado-v2-domain-hardening
    autoDeployTrigger: off
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node -r tsconfig-paths/register dist/src/server.js
    healthCheckPath: /health

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mobility-platform-offer-book-e2e-db
          property: connectionString

      - key: DIRECT_URL
        fromDatabase:
          name: mobility-platform-offer-book-e2e-db
          property: connectionString

      - key: NODE_ENV
        value: production

      - key: JWT_SECRET
        generateValue: true

      - key: ACCESS_TOKEN_TTL
        value: 15m

      - key: REFRESH_TOKEN_TTL
        value: 30d

      - key: RIDE_QUOTE_TTL
        value: 15m

      - key: E2E_RUN_ID
        value: offer-book-e2e-20260825

databases:
  - name: mobility-platform-offer-book-e2e-db

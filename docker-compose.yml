services:
  postgres:
    image: postgres:15
    container_name: mobility-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mobility
    ports:
      - "5432:5432"
    volumes:
      - mobility_postgres_data:/var/lib/postgresql/data

volumes:
  mobility_postgres_data: